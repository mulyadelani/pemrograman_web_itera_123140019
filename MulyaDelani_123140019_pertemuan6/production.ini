[app:main]
use = egg:pyramid_mahasiswa
sqlalchemy.url = postgresql+psycopg2://user:password@localhost:5432/pyramid_mahasiswa

[server:main]
use = egg:waitress#main
listen = 0.0.0.0:6543

[loggers]
keys = root, pyramid_mahasiswa

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_pyramid_mahasiswa]
level = INFO
handlers =
qualname = pyramid_mahasiswa

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s] %(message)s
